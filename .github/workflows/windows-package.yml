name: windows-package

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test-package:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore rename-ranger.sln

      - name: Test (Core)
        run: dotnet test tests/RenameRanger.Core.Tests/RenameRanger.Core.Tests.csproj -c Release --no-restore --verbosity normal

      - name: Publish portable self-contained win-x64
        run: dotnet publish src/RenameRanger.App/RenameRanger.App.csproj -c Release -p:PublishProfile=Properties/PublishProfiles/win-x64-portable.pubxml

      - name: Create portable zip
        shell: pwsh
        run: |
          $publishDir = "artifacts/publish/win-x64"
          if (!(Test-Path $publishDir)) { throw "Portable publish directory not found: $publishDir" }
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          Compress-Archive -Path "$publishDir/*" -DestinationPath "artifacts/rename-ranger-win-x64.zip" -Force

      - name: Publish MSIX package
        run: dotnet publish src/RenameRanger.App/RenameRanger.App.csproj -c Release -p:PublishProfile=Properties/PublishProfiles/win-x64-msix.pubxml

      - name: Verify MSIX output
        shell: pwsh
        run: |
          $msixFiles = Get-ChildItem -Path artifacts/msix -Recurse -File -Include *.msix,*.appx -ErrorAction SilentlyContinue
          if (-not $msixFiles) {
            throw "MSIX/AppX output not found under artifacts/msix"
          }
          $msixFiles | ForEach-Object { Write-Host "Found package artifact: $($_.FullName)" }

      - name: Upload portable zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: rename-ranger-win-x64
          path: artifacts/rename-ranger-win-x64.zip
          if-no-files-found: error

      - name: Upload MSIX artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rename-ranger-msix
          path: artifacts/msix
          if-no-files-found: error
